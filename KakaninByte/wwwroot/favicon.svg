<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- background pill -->
  <rect width="32" height="32" rx="8" fill="#161b22"/>

  <!-- rice grain body — warm ivory, tilted -->
  <ellipse cx="16" cy="16" rx="6" ry="11"
    transform="rotate(-35 16 16)"
    fill="#f5ead5"/>

  <!-- darker belly shadow at bottom of grain -->
  <ellipse cx="17.5" cy="19" rx="4" ry="7"
    transform="rotate(-35 16 16)"
    fill="#e2d0b0" opacity="0.6"/>

  <!-- center crease -->
  <path d="M12.5 10 Q16 16 18.5 22"
    stroke="#c9b48a" stroke-width="0.8"
    stroke-linecap="round" fill="none"
    transform="rotate(-35 16 16) translate(-1,-1)"/>

  <!-- highlight -->
  <ellipse cx="13.5" cy="13" rx="1.8" ry="3.5"
    transform="rotate(-35 16 16)"
    fill="white" opacity="0.4"/>
</svg>
